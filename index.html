<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Loop Finder · Pro</title>
<style>
:root{--bg:#0a0a0f;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.1);--accent:#38bdf8;--accent-2:#a855f7;--glow:rgba(56,189,248,.35);--text:#e5e7eb;--soft:#9ca3af;--danger:#ff3b30;--ok:#4ade80}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:28px 16px 60px;color:var(--text);font-family:"Inter","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);background-image:radial-gradient(600px 400px at 15% 0%,rgba(56,189,248,.10),transparent 60%),radial-gradient(700px 500px at 90% 100%,rgba(168,85,247,.10),transparent 60%);background-attachment:fixed}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:23px;font-weight:600;letter-spacing:.5px;margin-bottom:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--soft);font-size:13px;margin-bottom:22px;line-height:1.7}
.drop{position:relative;display:block;border:1.5px dashed var(--border);border-radius:18px;padding:32px 20px;text-align:center;background:var(--card);cursor:pointer;transition:border-color .2s,box-shadow .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--accent);box-shadow:0 0 26px var(--glow);background:rgba(56,189,248,.05)}
.drop .big{font-size:15px;font-weight:600;margin-bottom:6px}
.drop .small{font-size:12.5px;color:var(--soft)}
.drop input[type=file]{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2;-webkit-appearance:none;appearance:none}
.status{margin-top:12px;font-size:13.5px;color:var(--soft);text-align:center;min-height:20px;line-height:1.6;word-break:break-all}
.status.err{color:var(--danger)}.status.ok{color:var(--accent)}.status.warn{color:#fbbf24}
#env{margin-top:6px;font-size:11px;color:#555;text-align:center;font-family:monospace}
.namerow{margin-top:10px;display:none;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.namerow.on{display:flex}
.namerow label{font-size:12.5px;color:var(--soft)}
.namerow input{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:10px;font-size:13.5px;font-family:inherit;outline:none;min-width:200px}
.namerow input:focus{border-color:var(--accent);box-shadow:0 0 14px var(--glow)}
.panel{margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;display:none}
.panel.on{display:block}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}
.title{font-weight:600;font-size:15px}
.meta{font-size:12.5px;color:var(--soft);margin-top:3px}
.pill{font-size:12px;color:var(--accent);border:1px solid rgba(56,189,248,.3);background:rgba(56,189,248,.07);padding:5px 11px;border-radius:999px;font-variant-numeric:tabular-nums}
.wavebox{position:relative;height:150px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:rgba(0,0,0,.25);touch-action:none;cursor:crosshair}
canvas{display:block;width:100%;height:100%}
.playhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;left:0;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.9);pointer-events:none;display:none;z-index:5}
.playhead.on{display:block}
.timebar{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:6px;font-variant-numeric:tabular-nums}
.seginfo{margin-top:10px;font-size:12px;color:var(--soft);min-height:18px;font-variant-numeric:tabular-nums}
.seginfo b{color:var(--accent)}
.cands{margin-top:12px;max-height:300px;overflow-y:auto;padding-right:4px;-webkit-overflow-scrolling:touch}
.cands h4{font-size:12.5px;color:var(--soft);font-weight:500;margin-bottom:8px;letter-spacing:.4px}
.cand{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);margin-bottom:6px;cursor:pointer;font-size:12.5px;transition:border-color .15s,background .15s}
.cand:hover{border-color:rgba(255,255,255,.2)}
.cand.sel{border-color:var(--accent);background:rgba(56,189,248,.06);box-shadow:0 0 16px var(--glow)}
.cand .pair{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.cand .pa{color:#38bdf8;font-variant-numeric:tabular-nums}
.cand .pb{color:#a855f7;font-variant-numeric:tabular-nums}
.cand .sim{flex:0 0 50px;text-align:right;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.cand .sim.hi{color:var(--ok)}
.params{margin-top:14px;padding:12px;background:rgba(255,255,255,.03);border-radius:12px;border:1px solid var(--border)}
.params h4{font-size:12.5px;color:var(--soft);font-weight:500;margin-bottom:10px;letter-spacing:.4px}
.param{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.param:last-child{margin-bottom:0}
.param label{flex:0 0 90px;color:var(--soft)}
.param input[type=range]{flex:1;height:5px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.1);border-radius:3px;outline:none}
.param input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 8px var(--glow);border:none}
.param input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:none;box-shadow:0 0 8px var(--glow)}
.param .pv{flex:0 0 48px;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--card);color:var(--text);padding:10px 16px;border:1px solid var(--border);border-radius:12px;font-size:13.5px;font-family:inherit;cursor:pointer;user-select:none;transition:transform .15s,box-shadow .2s,border-color .2s}
.btn:hover{transform:translateY(-1px);border-color:var(--accent);box-shadow:0 0 18px var(--glow)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);color:#05060a;font-weight:600;border:none;box-shadow:0 0 18px var(--glow)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
@media(max-width:600px){
  body{padding:20px 12px 50px}
  .param label{flex:0 0 76px;font-size:12px}
  .btn{padding:9px 14px;font-size:13px}
  .wavebox{height:130px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>Auto Loop Finder</h1>
<p class="sub">段落级匹配 · 移调不变 · 节拍对齐 · 边界可拖拽微调</p>

<label class="drop" id="drop" for="file">
<div class="big">点击选择音频文件</div>
<div class="small">支持 mp3 / m4a / wav / aac · 也可拖拽</div>
<input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.aac,audio/mpeg,audio/mp4">
</label>

<div class="namerow" id="namerow">
<label for="nameInput">歌曲名</label>
<input type="text" id="nameInput" placeholder="输入歌曲名…" autocomplete="off">
</div>

<div class="status" id="status"></div>
<div id="env"></div>

<div class="panel" id="panel">
<div class="head">
<div><div class="title" id="pTitle">—</div><div class="meta" id="pMeta">—</div></div>
<div class="pill" id="pPill">—</div>
</div>

<div class="wavebox" id="wavebox">
<canvas id="wave"></canvas>
<div class="playhead" id="playhead"></div>
</div>
<div class="timebar"><span id="tNow">0:00</span><span id="tTotal">0:00</span></div>

<div class="seginfo" id="segInfo">点波形选段 · 拖边界手柄微调 · 点下方列表选段对</div>

<div class="cands" id="cands"></div>

<div class="params">
<h4>参数调整（每首歌独立保存）</h4>
<div class="param"><label>最短段</label><input type="range" id="pMin" min="4" max="40" step="1" value="8"><span class="pv" id="vMin">8s</span></div>
<div class="param"><label>最长段</label><input type="range" id="pMax" min="20" max="180" step="5" value="60"><span class="pv" id="vMax">60s</span></div>
<div class="param"><label>相似度</label><input type="range" id="pSim" min="0.5" max="0.98" step="0.01" value="0.78"><span class="pv" id="vSim">0.78</span></div>
<div class="param"><label>边界灵敏度</label><input type="range" id="pBnd" min="0.1" max="0.7" step="0.02" value="0.28"><span class="pv" id="vBnd">0.28</span></div>
<div class="param"><label>音高比重</label><input type="range" id="pWei" min="0" max="1" step="0.05" value="0.5"><span class="pv" id="vWei">0.50</span></div>
</div>

<div class="row">
<button class="btn primary" id="btnLoopA">▶ 循环 A 段</button>
<button class="btn" id="btnLoopB">▶ 循环 B 段</button>
<button class="btn ghost" id="btnStop">■ 停止</button>
</div>

<div class="row">
<button class="btn ghost" id="btnSplit">在播放头处拆分选中段</button>
<button class="btn ghost" id="btnMergeL">与左邻合并</button>
<button class="btn ghost" id="btnMergeR">与右邻合并</button>
<button class="btn ghost" id="btnReset">重置边界</button>
</div>
</div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ============================================================
   配置
   ============================================================ */
const CFG = {
  FMIN: 30,
  FMAX: 8000,
  HOP_SEC: 0.10,
  FRAME_SEC: 0.20,
  NOVELTY_K: 20,
  MIN_SEG: 8,
  MAX_SEG: 60,
  SIM_THRESHOLD: 0.78,
  BOUNDARY_SENS: 0.28,
  WEIGHT_PITCH: 0.5,
  BAND_EDGES: [62, 125, 250, 500, 1000, 2000, 4000, 8000],
  ONSET_HOP_SEC: 0.01
};
const DEF = {
  MIN_SEG: 8, MAX_SEG: 60,
  SIM_THRESHOLD: 0.78,
  BOUNDARY_SENS: 0.28,
  WEIGHT_PITCH: 0.5
};

/* ============================================================
   工具
   ============================================================ */
const fmt = t => {
  t = Math.max(0, t || 0);
  return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
};
const yieldUI = () => new Promise(r => setTimeout(r, 0));

try {
  if (navigator.audioSession && navigator.audioSession.type !== 'playback') {
    navigator.audioSession.type = 'playback';
  }
} catch (e) {}

(function () {
  const ua = navigator.userAgent;
  const isSafari = /^((?!chrome|android).)*safari/i.test(ua);
  const isIOS = /iPad|iPhone|iPod/.test(ua);
  const hasAC = !!(window.AudioContext || window.webkitAudioContext);
  const hasSession = !!navigator.audioSession;
  const lines = [];
  if (isIOS) lines.push('iOS');
  if (isSafari) lines.push('Safari'); else if (/chrome/i.test(ua)) lines.push('Chrome');
  lines.push(hasAC ? 'AC✓' : 'AC✗');
  lines.push(hasSession ? 'AS✓' : 'AS✗');
  $('#env').textContent = lines.join(' · ');
})();

/* ============================================================
   FFT（迭代 radix-2，原地）
   ============================================================ */
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wR = Math.cos(ang), wI = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cR = 1, cI = 0;
      for (let j = 0; j < len / 2; j++) {
        const uR = re[i + j], uI = im[i + j];
        const vR = re[i + j + len/2] * cR - im[i + j + len/2] * cI;
        const vI = re[i + j + len/2] * cI + im[i + j + len/2] * cR;
        re[i + j] = uR + vR; im[i + j] = uI + vI;
        re[i + j + len/2] = uR - vR; im[i + j + len/2] = uI - vI;
        const nR = cR * wR - cI * wI;
        cI = cR * wI + cI * wR; cR = nR;
      }
    }
  }
}

/* ============================================================
   立体声 → 单声道
   ============================================================ */
function toMono(buf) {
  const n = buf.numberOfChannels, L = buf.length;
  if (n === 1) return buf.getChannelData(0).slice();
  const out = new Float32Array(L);
  for (let c = 0; c < n; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < L; i++) out[i] += d[i];
  }
  const g = 1 / n;
  for (let i = 0; i < L; i++) out[i] *= g;
  return out;
}

/* ============================================================
   特征提取：Chroma（12）+ 频谱对比度（7）+ RMS
   ============================================================ */
function extractFeatures(mono, sr) {
  const hop = Math.round(CFG.HOP_SEC * sr);
  const fsz = 1 << Math.ceil(Math.log2(CFG.FRAME_SEC * sr));
  const half = fsz >> 1;
  const N = Math.max(1, Math.floor((mono.length - fsz) / hop) + 1);

  const win = new Float32Array(fsz);
  for (let i = 0; i < fsz; i++) {
    win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (fsz - 1));
  }

  // bin → chroma index (0-11)，超范围 = -1
  const binC = new Int8Array(half).fill(-1);
  const binW = new Float32Array(half);
  for (let i = 1; i < half; i++) {
    const f = i * sr / fsz;
    if (f < CFG.FMIN || f > CFG.FMAX) continue;
    binC[i] = ((Math.round(69 + 12 * Math.log2(f / 440)) % 12) + 12) % 12;
    // 频率权重：抑制极低频和极高频，但比之前宽松，保留更多细节
    let w = 1;
    if (f < 80) w = 0.15;
    else if (f < 150) w = 0.35;
    else if (f < 300) w = 0.7;
    else if (f > 6000) w = 0.6;
    binW[i] = w;
  }

  // 频带边界（FFT bin）
  const bandEdges = CFG.BAND_EDGES.map(f => Math.round(f * fsz / sr));

  const chroma = new Float32Array(N * 12);
  const contrast = new Float32Array(N * 7);
  const rms = new Float32Array(N);
  const re = new Float32Array(fsz), im = new Float32Array(fsz);
  const mag = new Float32Array(half);

  for (let t = 0; t < N; t++) {
    const off = t * hop;
    for (let i = 0; i < fsz; i++) {
      re[i] = mono[off + i] * win[i];
      im[i] = 0;
    }
    fft(re, im);

    let sum2 = 0;
    for (let i = 1; i < half; i++) {
      const m = Math.sqrt(re[i] * re[i] + im[i] * im[i]);
      mag[i] = m;
      sum2 += m * m;
    }
    rms[t] = Math.sqrt(sum2 / half);

    const base = t * 12;
    for (let i = 1; i < half; i++) {
      const c = binC[i];
      if (c < 0) continue;
      chroma[base + c] += mag[i] * binW[i];
    }
    let nrm = 0;
    for (let k = 0; k < 12; k++) nrm += chroma[base + k] * chroma[base + k];
    nrm = Math.sqrt(nrm) || 1;
    for (let k = 0; k < 12; k++) chroma[base + k] /= nrm;

    // 频谱对比度（每频带：峰值 / 均值，log 归一化）
    const cbase = t * 7;
    for (let b = 0; b < 7; b++) {
      const a = Math.max(1, bandEdges[b]);
      const e = Math.min(half, bandEdges[b + 1]);
      if (e <= a) { contrast[cbase + b] = 0; continue; }
      let sum = 0, mx = 0, cnt = 0;
      for (let i = a; i < e; i++) {
        const m = mag[i];
        sum += m;
        if (m > mx) mx = m;
        cnt++;
      }
      const mean = cnt ? sum / cnt : 1e-6;
      // log2(峰值/均值 + 1) 作为对比度
      contrast[cbase + b] = Math.log2(mx / (mean + 1e-6) + 1);
    }
    // 帧内归一化
    let mx2 = 0;
    for (let b = 0; b < 7; b++) if (contrast[cbase + b] > mx2) mx2 = contrast[cbase + b];
    if (mx2 > 0.001) {
      for (let b = 0; b < 7; b++) contrast[cbase + b] = Math.min(contrast[cbase + b] / mx2, 1);
    }
  }
  return { chroma, contrast, rms, N, hopSec: CFG.HOP_SEC };
}

/* ============================================================
   起音包络（10ms 帧率，用于 BPM 估计和边界精修）
   ============================================================ */
function computeOnsetEnvelope(mono, sr) {
  const hop = Math.round(CFG.ONSET_HOP_SEC * sr);
  const winSize = Math.round(0.03 * sr);
  const N = Math.max(1, Math.floor((mono.length - winSize) / hop) + 1);
  const env = new Float32Array(N);

  let prev = 0;
  for (let t = 0; t < N; t++) {
    const off = t * hop;
    let s = 0;
    for (let i = 0; i < winSize; i++) {
      const d = mono[off + i];
      s += d * d;
    }
    const cur = Math.sqrt(s / winSize);
    env[t] = Math.max(0, cur - prev);
    prev = cur;
  }
  // 平滑
  const sm = new Float32Array(N);
  for (let i = 2; i < N - 2; i++) {
    sm[i] = (env[i-2] + env[i-1] + env[i] + env[i+1] + env[i+2]) / 5;
  }
  return { env: sm, hopSec: CFG.ONSET_HOP_SEC, N };
}

/* ============================================================
   帧相似度（移调不变 chroma + 对比度）
   ============================================================ */
function frameSim(chroma, contrast, i, j) {
  const bi = i * 12, bj = j * 12;
  // 12 种半音旋转取最大
  let best = 0;
  for (let sh = 0; sh < 12; sh++) {
    let s = 0;
    for (let k = 0; k < 12; k++) {
      s += chroma[bi + k] * chroma[bj + ((k + sh) % 12)];
    }
    if (s > best) best = s;
  }
  const ci = i * 7, cj = j * 7;
  let cSim = 0;
  for (let k = 0; k < 7; k++) cSim += contrast[ci + k] * contrast[cj + k];
  return 0.6 * best + 0.4 * cSim;
}

/* ============================================================
   Novelty：checkerboard kernel 检测内容突变
   ============================================================ */
function computeNovelty(chroma, contrast, N, K) {
  const nov = new Float32Array(N);
  for (let t = K; t < N - K; t++) {
    // in-left × in-left
    let inSum = 0, inCnt = 0;
    for (let i = t - K; i < t; i++) {
      for (let j = i + 1; j < t; j++) {
        inSum += frameSim(chroma, contrast, i, j);
        inCnt++;
      }
    }
    // in-right × in-right
    let outSum = 0, outCnt = 0;
    for (let i = t; i < t + K; i++) {
      for (let j = i + 1; j < t + K; j++) {
        outSum += frameSim(chroma, contrast, i, j);
        outCnt++;
      }
    }
    // cross
    let crossSum = 0, crossCnt = 0;
    for (let i = t - K; i < t; i++) {
      for (let j = t; j < t + K; j++) {
        crossSum += frameSim(chroma, contrast, i, j);
        crossCnt++;
      }
    }
    const a = inCnt ? inSum / inCnt : 0;
    const b = outCnt ? outSum / outCnt : 0;
    const c = crossCnt ? crossSum / crossCnt : 0;
    nov[t] = (a + b) / 2 - c;
  }
  return nov;
}

/* ============================================================
   峰值拾取 + 边界吸附到起音
   ============================================================ */
function findBoundaryPeaks(nov, N, minFrames, sensitivity) {
  // 平滑
  const sm = new Float32Array(N);
  const sw = 4;
  for (let i = 0; i < N; i++) {
    let s = 0, c = 0;
    for (let j = Math.max(0, i - sw); j <= Math.min(N - 1, i + sw); j++) {
      s += nov[j]; c++;
    }
    sm[i] = s / c;
  }
  let mx = 0;
  for (let i = 0; i < N; i++) if (sm[i] > mx) mx = sm[i];
  const th = mx * sensitivity;
  if (th <= 0) return [0, N];
  const peaks = [];
  for (let i = 1; i < N - 1; i++) {
    if (sm[i] > sm[i-1] && sm[i] >= sm[i+1] && sm[i] > th) {
      peaks.push(i);
    }
  }
  const filtered = [];
  for (const p of peaks) {
    if (filtered.length === 0 || p - filtered[filtered.length - 1] >= minFrames) {
      filtered.push(p);
    }
  }
  return [0, ...filtered, N];
}

function snapBoundariesToOnsets(boundaries, onsetEnv, onsetHop, featHop, N) {
  const snapped = [0];
  for (let i = 1; i < boundaries.length - 1; i++) {
    const bf = boundaries[i];
    const tSec = bf * featHop;
    // 在 ±0.25 秒范围内找最强起音
    const win = Math.round(0.25 / onsetHop);
    const center = Math.round(tSec / onsetHop);
    const a = Math.max(1, center - win);
    const b = Math.min(onsetEnv.length - 2, center + win);
    let bestIdx = -1, bestVal = 0;
    for (let j = a; j <= b; j++) {
      if (onsetEnv[j] > bestVal) {
        bestVal = onsetEnv[j];
        bestIdx = j;
      }
    }
    if (bestIdx > 0 && bestVal > 0) {
      // 转为特征帧索引
      const tSnap = bestIdx * onsetHop;
      const fSnap = Math.round(tSnap / featHop);
      if (fSnap > snapped[snapped.length - 1] + 2 && fSnap < N - 2) {
        snapped.push(fSnap);
      } else {
        snapped.push(bf);
      }
    } else {
      snapped.push(bf);
    }
  }
  snapped.push(N);
  return snapped;
}

/* ============================================================
   段落特征
   ============================================================ */
function buildSegments(chroma, contrast, rms, boundaries, hop, sr, mono) {
  const segs = [];
  for (let k = 0; k < boundaries.length - 1; k++) {
    const a = boundaries[k], b = boundaries[k + 1];
    const nFrames = b - a;
    if (nFrames < 2) continue;

    const featP = new Float32Array(12);
    const featT = new Float32Array(7);
    let rmsSum = 0;

    for (let t = a; t < b; t++) {
      const bp = t * 12, bt = t * 7;
      for (let j = 0; j < 12; j++) featP[j] += chroma[bp + j];
      for (let j = 0; j < 7; j++) featT[j] += contrast[bt + j];
      rmsSum += rms[t];
    }
    // 归一化
    let nP = 0;
    for (let j = 0; j < 12; j++) nP += featP[j] * featP[j];
    nP = Math.sqrt(nP) || 1;
    for (let j = 0; j < 12; j++) featP[j] /= nP;

    let nT = 0;
    for (let j = 0; j < 7; j++) nT += featT[j] * featT[j];
    nT = Math.sqrt(nT) || 1;
    for (let j = 0; j < 7; j++) featT[j] /= nT;

    const startSec = a * hop;
    const endSec = b * hop;
    const dur = endSec - startSec;
    const avgRms = rmsSum / nFrames;

    segs.push({
      idx: k,
      startFrame: a,
      endFrame: b,
      startSec, endSec, dur,
      featP, featT, avgRms
    });
  }
  return segs;
}

/* ============================================================
   段落匹配
   ============================================================ */
function tiPitchSim(a, b) {
  let best = 0;
  for (let sh = 0; sh < 12; sh++) {
    let s = 0;
    for (let k = 0; k < 12; k++) s += a[k] * b[(k + sh) % 12];
    if (s > best) best = s;
  }
  return best;
}

function timbreSim(a, b) {
  let s = 0;
  for (let k = 0; k < 7; k++) s += a[k] * b[k];
  return s;
}

function matchSegments(segs, minSec, maxSec, minSim, wPitch) {
  const pairs = [];
  for (let i = 0; i < segs.length; i++) {
    const si = segs[i];
    if (si.dur < minSec || si.dur > maxSec) continue;
    for (let j = i + 1; j < segs.length; j++) {
      const sj = segs[j];
      if (sj.dur < minSec || sj.dur > maxSec) continue;
      const durRatio = Math.min(si.dur, sj.dur) / Math.max(si.dur, sj.dur);
      if (durRatio < 0.55) continue;

      const pitch = tiPitchSim(si.featP, sj.featP);
      const timbre = timbreSim(si.featT, sj.featT);
      const durS = durRatio;
      // 加权组合
      const sim = wPitch * pitch + (1 - wPitch) * (0.7 * timbre + 0.3 * durS);

      if (sim >= minSim) {
        pairs.push({
          i, j, sim, pitch, timbre, dur: durS,
          A: si, B: sj
        });
      }
    }
  }
  pairs.sort((a, b) => b.sim - a.sim);
  return pairs;
}

/* ============================================================
   参数记忆
   ============================================================ */
const paramMemory = {};
const nameMap = (() => {
  try { return JSON.parse(localStorage.getItem('loop-names-pro') || '{}'); }
  catch (e) { return {}; }
})();
function persistNameMap() {
  try { localStorage.setItem('loop-names-pro', JSON.stringify(nameMap)); } catch (e) {}
}
function loadParams(name) {
  const s = paramMemory[name];
  if (s) {
    CFG.MIN_SEG = s.MIN_SEG;
    CFG.MAX_SEG = s.MAX_SEG;
    CFG.SIM_THRESHOLD = s.SIM_THRESHOLD;
    CFG.BOUNDARY_SENS = s.BOUNDARY_SENS;
    CFG.WEIGHT_PITCH = s.WEIGHT_PITCH;
  } else {
    Object.assign(CFG, DEF);
  }
}
function saveParams(name) {
  paramMemory[name] = {
    MIN_SEG: CFG.MIN_SEG,
    MAX_SEG: CFG.MAX_SEG,
    SIM_THRESHOLD: CFG.SIM_THRESHOLD,
    BOUNDARY_SENS: CFG.BOUNDARY_SENS,

}

   DOM 引用

const drop = $('#drop'), fileInput = $('#file'), statusEl = $('#status'), panel = $('#panel');
const nameInput = $('#nameInput'), namerow = $('#namerow');

/* ============================================================
   文件导入
   ============================================================ */
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) prepareFile(f);
});
fileInput.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) { statusEl.className = 'status err'; statusEl.textContent = '未获取到文件'; return; }
  if (!S.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { statusEl.className = 'status err'; statusEl.textContent = '浏览器不支持 AudioContext'; return; }
    try { S.ctx = new AC(); } catch (err) {
      statusEl.className = 'status err'; statusEl.textContent = 'AudioContext 创建失败：' + err.message; return;
    }
  }
  if (S.ctx.state === 'suspended') { try { S.ctx.resume(); } catch (err) {} }
  prepareFile(f);
});

nameInput.addEventListener('input', e => {
  const newName = (e.target.value || '').trim() || '未命名';
  if (newName === S.fileName) return;
  const oldName = S.fileName;
  if (oldName && paramMemory[oldName]) {
    paramMemory[newName] = paramMemory[oldName];
    delete paramMemory[oldName];
  }
  if (S.originalName) {
    nameMap[S.originalName] = newName;
    persistNameMap();
  }
  S.fileName = newName;
  saveParams(newName);
  if (S.segments) $('#pTitle').textContent = newName;
});

function prepareFile(file) {
  stopPlay();
  S.fileName = '';
  S.originalName = file.name.replace(/\.[^.]+$/, '');
  const customName = (nameMap[S.originalName] || S.originalName) || '未命名';
  S.fileName = customName;
  nameInput.value = customName;
  namerow.classList.add('on');
  loadParams(customName);
  syncSliders();
  analyzeFile(file);
}

async function readFileAsArrayBuffer(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.onerror = () => rej(new Error('读取文件失败：' + (reader.error && reader.error.message || '未知')));
    try { reader.readAsArrayBuffer(file); } catch (e) { rej(e); }
  });
}

async function decodeWithFallback(file, ctx) {
  const buf = await readFileAsArrayBuffer(file);
  try {
    return await new Promise((res, rej) => {
      try { ctx.decodeAudioData(buf, res, rej); } catch (e) { rej(e); }
    });
  } catch (e1) {
    try {
      const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const off = new OAC(2, 44100, 44100);
      return await new Promise((res, rej) => {
        try { off.decodeAudioData(buf, res, rej); } catch (e) { rej(e); }
      });
    } catch (e2) {
      throw new Error((e1 && e1.message) || String(e1) || 'decodeAudioData 失败');
    }
  }
}

/* ============================================================
   分析主流程
   ============================================================ */
async function analyzeFile(file) {
  const mb = (file.size / 1048576).toFixed(2);
  statusEl.className = 'status';
  statusEl.textContent = '正在解码音频…（' + mb + 'MB）';
  panel.classList.remove('on');
  try {
    if (!S.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      S.ctx = new AC();
    }
    if (S.ctx.state === 'suspended') { try { await S.ctx.resume(); } catch (e) {} }
    const ab = await decodeWithFallback(file, S.ctx);
    S.buffer = ab;
    S.sr = ab.sampleRate;
    S.duration = ab.duration;
    S.mono = toMono(ab);

    statusEl.textContent = '正在提取音级特征（Chroma）…'; await yieldUI();
    const feat = extractFeatures(S.mono, S.sr);
    S.chroma = feat.chroma;
    S.contrast = feat.contrast;
    S.rms = feat.rms;
    S.N = feat.N;
    S.hopSec = feat.hopSec;

    statusEl.textContent = '正在计算起音包络…'; await yieldUI();
    const onset = computeOnsetEnvelope(S.mono, S.sr);
    S.onsetEnv = onset.env;
    S.onsetHopSec = onset.hopSec;

    statusEl.textContent = '正在做结构分析（Novelty）…（可能需要 10-30 秒）';
    await yieldUI();
    S.novelty = computeNovelty(S.chroma, S.contrast, S.N, CFG.NOVELTY_K);

    await runStructure();
  } catch (err) {
    console.error(err);
    statusEl.className = 'status err';
    statusEl.textContent = '分析失败：' + ((err && err.message) || err);
  }
}

async function runStructure() {
  if (!S.novelty) return;
  const minFrames = Math.round(CFG.MIN_SEG / S.hopSec);
  let bounds = findBoundaryPeaks(S.novelty, S.N, minFrames, CFG.BOUNDARY_SENS);
  // 吸附到起音
  bounds = snapBoundariesToOnsets(bounds, S.onsetEnv, S.onsetHopSec, S.hopSec, S.N);
  // 保存原始边界（重置时恢复）
  if (!S.originalBoundaries || S.originalBoundaries.length < 2) {
    S.originalBoundaries = bounds.slice();
  }
  S.boundaries = bounds;

  // 构建段落
  S.segments = buildSegments(
    S.chroma, S.contrast, S.rms, S.boundaries,
    S.hopSec, S.sr, S.mono
  );

  // 匹配
  S.pairs = matchSegments(
    S.segments, CFG.MIN_SEG, CFG.MAX_SEG,
    CFG.SIM_THRESHOLD, CFG.WEIGHT_PITCH
  );
  S.selectedPairIdx = -1;
  S.selectedSegIdx = -1;

  renderPanel();
  renderCands();
  drawWave();

  if (S.pairs.length > 0) {
    selectPair(0);
    statusEl.className = 'status ok';
    statusEl.textContent = '分析完成：' + (S.boundaries.length - 1) + ' 个段落 · ' + S.pairs.length + ' 个匹配对';
  } else {
    statusEl.className = 'status err';
    statusEl.textContent = '未找到相似段对。可调低相似度、调高边界灵敏度、或调整音高比重后重试。';
  }
}

/* ============================================================
   重算（参数改变或边界拖拽后）
   ============================================================ */
async function recomputeAll() {
  if (!S.chroma) return;
  S.segments = buildSegments(S.chroma, S.contrast, S.rms, S.boundaries, S.hopSec, S.sr, S.mono);
  S.pairs = matchSegments(S.segments, CFG.MIN_SEG, CFG.MAX_SEG, CFG.SIM_THRESHOLD, CFG.WEIGHT_PITCH);
  if (S.pairs.length > 0) {
    selectPair(Math.min(S.selectedPairIdx < 0 ? 0 : S.selectedPairIdx, S.pairs.length - 1));
  } else {
    S.selectedPairIdx = -1;
    renderCands();
    drawWave();
  }
}

async function redoBoundaries() {
  if (!S.novelty) return;
  const minFrames = Math.round(CFG.MIN_SEG / S.hopSec);
  let bounds = findBoundaryPeaks(S.novelty, S.N, minFrames, CFG.BOUNDARY_SENS);
  bounds = snapBoundariesToOnsets(bounds, S.onsetEnv, S.onsetHopSec, S.hopSec, S.N);
  S.boundaries = bounds;
  S.originalBoundaries = bounds.slice();
  await recomputeAll();
}

/* ============================================================
   面板渲染
   ============================================================ */
function renderPanel() {
  panel.classList.add('on');
  $('#pTitle').textContent = S.fileName || '未命名';
  $('#pMeta').textContent =

    (S.pairs ? S.pairs.length : 0) + ' 匹配对';

function renderCands() {
  const box = $('#cands');
  if (!S.pairs || S.pairs.length === 0) {
    box.innerHTML = '';
    return;
  }
  const maxShow = Math.min(S.pairs.length, 40);

  for (let k = 0; k < maxShow; k++) {
    const p = S.pairs[k];

    el.innerHTML =
      '<div class="pair">' +
        '<span class="pa">A · ' + fmt(p.A.startSec) + ' → ' + fmt(p.A.endSec) + ' (' + p.A.dur.toFixed(1) + 's)</span>' +
        '<span class="pb">B · ' + fmt(p.B.startSec) + ' → ' + fmt(p.B.endSec) + ' (' + p.B.dur.toFixed(1) + 's)</span>' +
      '</div>' +
      '<span class="sim' + (p.sim > 0.9 ? ' hi' : '') + '">' + (p.sim * 100).toFixed(0) + '%</span>';

}

function selectPair(idx) {
  if (!S.pairs || idx < 0 || idx >= S.pairs.length) return;
  S.selectedPairIdx = idx;
  const p = S.pairs[idx];
  S.selectedSegIdx = p.i;
  renderCands();
  drawWave();
  updateSegInfo();
  $('#pPill').textContent = fmt(p.A.startSec) + ' → ' + fmt(p.A.endSec) + ' / ' + fmt(p.B.startSec) + ' → ' + fmt(p.B.endSec);
  if (S.playing) stopPlay();
}

function updateSegInfo() {
  const el = $('#segInfo');
  if (S.selectedPairIdx >= 0 && S.pairs) {
    const p = S.pairs[S.selectedPairIdx];
    el.innerHTML = '已选：<b>A 段</b> ' + fmt(p.A.startSec) + ' → ' + fmt(p.A.endSec) +
      ' · <b>B 段</b> ' + fmt(p.B.startSec) + ' → ' + fmt(p.B.endSec) +
      ' · 相似度 ' + (p.sim * 100).toFixed(1) + '%' +
      ' (音高 ' + (p.pitch * 100).toFixed(0) + '% / 音色 ' + (p.timbre * 100).toFixed(0) + '%)';
  } else if (S.selectedSegIdx >= 0 && S.segments && S.segments[S.selectedSegIdx]) {
    const s = S.segments[S.selectedSegIdx];
    el.innerHTML = '已选段 #' + S.selectedSegIdx + '：' + fmt(s.startSec) + ' → ' + fmt(s.endSec) + ' (' + s.dur.toFixed(1) + 's)';
  } else {
    el.textContent = '点波形选段 · 拖边界手柄微调 · 点下方列表选段对';
  }
}

/* ============================================================
   波形绘制
   ============================================================ */
function computePeaks(width) {
  const mono = S.mono, len = mono.length, step = len / width;
  const peaks = new Float32Array(width * 2);
  for (let x = 0; x < width; x++) {
    const s = Math.floor(x * step);
    const e = Math.min(len, Math.floor((x + 1) * step));
    let mn = 1, mx = -1;
    for (let i = s; i < e; i++) {
      const v = mono[i];
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
    peaks[x * 2] = mn;
    peaks[x * 2 + 1] = mx;
  }
  return peaks;
}

function drawWave() {
  if (!S.mono) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = wavebox.clientWidth;
  const H = wavebox.clientHeight;
  if (W < 2 || H < 2) return;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // 背景
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  ctx.fillRect(0, 0, W, H);

  if (!S.peaks || S.peaksW !== W || S.peaksH !== H) {
    S.peaks = computePeaks(W);
    S.peaksW = W;
    S.peaksH = H;
  }

  // 高亮选中段对
  if (S.selectedPairIdx >= 0 && S.pairs) {
    const p = S.pairs[S.selectedPairIdx];
    const ax1 = p.A.startSec / S.duration * W;
    const ax2 = p.A.endSec / S.duration * W;
    const bx1 = p.B.startSec / S.duration * W;
    const bx2 = p.B.endSec / S.duration * W;
    ctx.fillStyle = 'rgba(56,189,248,0.18)';
    ctx.fillRect(ax1, 0, ax2 - ax1, H);
    ctx.fillStyle = 'rgba(168,85,247,0.18)';
    ctx.fillRect(bx1, 0, bx2 - bx1, H);
  } else if (S.selectedSegIdx >= 0 && S.segments && S.segments[S.selectedSegIdx]) {
    const s = S.segments[S.selectedSegIdx];
    const x1 = s.startSec / S.duration * W;
    const x2 = s.endSec / S.duration * W;
    ctx.fillStyle = 'rgba(56,189,248,0.15)';
    ctx.fillRect(x1, 0, x2 - x1, H);
  }

  // 波形
  const mid = H / 2;
  const grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, '#38bdf8');
  grad.addColorStop(1, '#a855f7');
  ctx.fillStyle = grad;
  for (let x = 0; x < W; x++) {
    const mn = S.peaks[x * 2], mx = S.peaks[x * 2 + 1];
    const y1 = mid - mx * mid * 0.9;
    const y2 = mid - mn * mid * 0.9;
    ctx.fillRect(x, y1, 1, Math.max(1, y2 - y1));
  }

  // 段落边界线
  if (S.boundaries && S.boundaries.length > 2) {
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    for (let i = 1; i < S.boundaries.length - 1; i++) {
      const x = S.boundaries[i] / S.N * W;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
      // 顶部手柄
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x, 8, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.beginPath();
      ctx.arc(x, 8, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 选中段对边界加粗
  if (S.selectedPairIdx >= 0 && S.pairs) {
    const p = S.pairs[S.selectedPairIdx];
    const marks = [
      [p.A.startSec / S.duration * W, '#38bdf8'],
      [p.A.endSec / S.duration * W, '#38bdf8'],
      [p.B.startSec / S.duration * W, '#a855f7'],
      [p.B.endSec / S.duration * W, '#a855f7']
    ];
    ctx.lineWidth = 2;
    for (const [x, color] of marks) {
      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
  }
}

/* ============================================================
   波形交互：点击定位 + 拖拽边界
   ============================================================ */
let pointerDownX = 0;
let pointerDownTime = 0;

wavebox.addEventListener('pointerdown', e => {
  if (!S.mono) return;
  e.preventDefault();
  const rect = wavebox.getBoundingClientRect();
  const x = e.clientX - rect.left;
  pointerDownX = x;
  pointerDownTime = Date.now();

  // 检查是否在边界附近
  const W = rect.width;
  const hitRadius = 10;
  let hitIdx = -1;
  let bestDist = hitRadius;
  if (S.boundaries) {
    for (let i = 1; i < S.boundaries.length - 1; i++) {
      const bx = S.boundaries[i] / S.N * W;
      const d = Math.abs(bx - x);
      if (d < bestDist) {
        bestDist = d;
        hitIdx = i;
      }
    }
  }

  if (hitIdx > 0) {
    S.draggingBoundary = hitIdx;
    wavebox.setPointerCapture(e.pointerId);
    return;
  }

  // 否则定位播放头
  const pct = Math.max(0, Math.min(1, x / W));
  const t = pct * S.duration;
  playheadEl.classList.add('on');
  playheadEl.style.left = (pct * 100) + '%';
  $('#tNow').textContent = fmt(t);

  // 找该位置所属的段落
  if (S.segments) {
    for (let k = 0; k < S.segments.length; k++) {
      const s = S.segments[k];
      if (t >= s.startSec && t <= s.endSec) {
        S.selectedSegIdx = k;
        // 找与该段相关的匹配对
        if (S.pairs) {
          let found = -1;
          for (let p = 0; p < S.pairs.length; p++) {
            if (S.pairs[p].i === k || S.pairs[p].j === k) { found = p; break; }
          }
          if (found >= 0) {
            S.selectedPairIdx = found;
            renderCands();
          }
        }
        drawWave();
        updateSegInfo();
        break;
      }
    }
  }
});

wavebox.addEventListener('pointermove', e => {
  if (S.draggingBoundary < 0) return;
  e.preventDefault();
  const rect = wavebox.getBoundingClientRect();
  const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
  const t = x / rect.width * S.duration;
  const newFrame = Math.round(t / S.hopSec);
  const idx = S.draggingBoundary;
  const prevFrame = S.boundaries[idx - 1];
  const nextFrame = S.boundaries[idx + 1];
  const minGap = Math.round(2 / S.hopSec); // 至少 2 秒
  const clamped = Math.max(prevFrame + minGap, Math.min(nextFrame - minGap, newFrame));
  S.boundaries[idx] = clamped;
  // 重新构建段落（不重匹配，等松手）
  drawWave();
});

wavebox.addEventListener('pointerup', async e => {
  if (S.draggingBoundary >= 0) {
    S.draggingBoundary = -1;
    try { wavebox.releasePointerCapture(e.pointerId); } catch (err) {}
    await recomputeAll();
    statusEl.className = 'status ok';
    statusEl.textContent = '边界已调整，重新匹配完成';
  }
});

wavebox.addEventListener('pointercancel', () => {
  if (S.draggingBoundary >= 0) {
    S.draggingBoundary = -1;
    recomputeAll();
  }
});

function ensureCtxRunning() {
  if (!S.ctx) return;
  if (S.ctx.state !== 'running') {
    try { S.ctx.resume(); } catch (e) {}
  }
  if (S.ctx.state !== 'running') {

  }
}

function stopPlay() {
  if (S.srcNode) {
    try { S.srcNode.stop(); } catch (e) {}
    try { S.srcNode.disconnect(); } catch (e) {}
    S.srcNode = null;
  }
  S.playing = false;
  if (S.rafId) cancelAnimationFrame(S.rafId);
  S.rafId = null;
  playheadEl.classList.remove('on');
  updatePlayBtns();
}

function updatePlayBtns() {
  $('#btnLoopA').textContent = (S.playing && S.mode === 'A') ? '❚❚ 停止循环' : '▶ 循环 A 段';
  $('#btnLoopB').textContent = (S.playing && S.mode === 'B') ? '❚❚ 停止循环' : '▶ 循环 B 段';
}

function startLoop(startSec, endSec, mode) {
  if (!S.buffer || !S.ctx) return;
  if (endSec - startSec < 0.5) return;
  ensureCtxRunning();
  stopPlay();

  const node = S.ctx.createBufferSource();
  const gain = S.ctx.createGain();
  gain.gain.value = 1;
  node.buffer = S.buffer;
  node.loop = true;
  node.loopStart = startSec;
  node.loopEnd = endSec;
  node.connect(gain);
  gain.connect(S.ctx.destination);

  const t0 = S.ctx.currentTime + 0.05;
  node.start(t0, startSec);

  S.srcNode = node;
  S.gainNode = gain;
  S.startCtxTime = t0;
  S.startOffset = startSec;
  S.endOffset = endSec;
  S.playing = true;
  S.mode = mode;

  playheadEl.classList.add('on');
  updatePlayBtns();
  rafLoop();

  setTimeout(() => {
    if (S.ctx && S.ctx.state !== 'running') {
      statusEl.className = 'status warn';
      statusEl.textContent = 'AudioContext 未运行。检查：① 侧边静音拨片 ② 音量 ③ 用 Safari 打开';
    }
  }, 900);
}

function rafLoop() {
  if (!S.playing) return;
  const span = S.endOffset - S.startOffset;
  if (span <= 0) { stopPlay(); return; }
  const elapsed = S.ctx.currentTime - S.startCtxTime;
  const t = S.startOffset + (((elapsed % span) + span) % span);
  playheadEl.style.left = (t / S.duration * 100) + '%';
  $('#tNow').textContent = fmt(t);
  S.rafId = requestAnimationFrame(rafLoop);
}
